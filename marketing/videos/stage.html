<body><div id="stage"></div>
<script>
let S, W, H, AY, scenesEl = [], capIdx = -2;
const INTERNOS = { '3.png': [[8, 36, 372, 14, '#060606']], '7.png': [[8, 29, 168, 18, '#040404'], [468, 29, 506, 18, '#040404']],
  '14.png': [[200, 30, 140, 12, '#3e4547']], '15.png': [[450, 36, 300, 14, '#1e0d10'], [750, 36, 200, 14, '#040404']] };
const ease = x => x < 0 ? 0 : x > 1 ? 1 : (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;

function camAt(cam, t) {
  if (t <= cam[0].t) return cam[0];
  for (let i = 0; i < cam.length - 1; i++) {
    const a = cam[i], b = cam[i + 1];
    if (t <= b.t) { const k = ease((t - a.t) / (b.t - a.t)); return { cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), z: lerp(a.z, b.z, k) }; }
  }
  return cam[cam.length - 1];
}

function sampleColor(img, x, y) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(Math.round(x), Math.round(y), 1, 1).data; return `rgb(${d[0]},${d[1]},${d[2]})`;
}

async function init(spec) {
  S = spec; W = spec.w; H = spec.h; AY = spec.ay || H / 2;
  if (spec.alpha) document.documentElement.classList.add('alpha');

  if (idx >= 0) { const c = caps[idx]; const a = ease(clamp01((t - c.t0) / .35)) * clamp01((c.t1 - t) / .25); cap.style.opacity = a; cap.style.transform = `translateY(${(1 - ease(clamp01((t - c.t0) / .35))) * 40}px)`; } else cap.style.opacity = 0;
  // cartela final
  if (S.end) {
    const e = document.getElementById('end'); const k = clamp01((t - S.end.t0) / .5);
    e.style.opacity = k; e.style.display = k <= 0 ? 'none' : 'flex';
    const lg = e.querySelector('img'); lg.style.transform = `scale(${.86 + .14 * ease(k)})`;
  }
  const wmOp = S.end ? 1 - clamp01((t - S.end.t0) / .3) : 1;
  document.getElementById('wm').style.opacity = .92 * wmOp;
  const rp = document.getElementById('rp'); if (rp) rp.style.opacity = (t >= (S.replayFrom || 0) && t <= (S.replayUntil || 1e9)) ? wmOp : 0;
  if (S.hideWm) document.getElementById('wm').style.opacity = 0;
  await Promise.all(waits);
}
